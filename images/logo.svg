<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="180" height="50">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:#ff9900"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <rect x="2" y="2" width="46" height="46" rx="8" fill="url(#lg)"/>
  <!-- 糖葫芦/甜甜圈装饰 -->
  <circle cx="14" cy="16" r="5" fill="#fff" opacity=".9"/>
  <circle cx="25" cy="25" r="5" fill="#fff" opacity=".9"/>
  <circle cx="36" cy="16" r="5" fill="#fff" opacity=".9"/>
  <text x="25" y="29" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">🍬</text>
  <!-- 文字: 好再来 -->
  <text x="66" y="22" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="24" font-weight="900" fill="#131921">
    好<tspan fill="#ff9900">再来</tspan>
  </text>
  <!-- 英文小标 -->
  <text x="68" y="40" font-family="Arial,sans-serif" font-size="11" fill="#565959" font-weight="600" letter-spacing="2">
    HAOZAI.LAI
  </text>
</svg>
